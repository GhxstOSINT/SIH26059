name: Southern Passage CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-preprocessing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-motion-research.txt

      - name: Install optional geospatial research dependencies
        run: python -m pip install -r requirements-motion-research.txt

      - name: Install test runner
        run: python -m pip install -r requirements-test.txt

      - name: Exercise NSIDC vector reprojection and masking
        run: python -m pytest -q tests/test_ice_motion.py tests/test_align_nsidc0116.py tests/test_evaluate_nsidc0116_advection.py

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Install hash-locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run API, data, and model tests
        run: python -m pytest -q

      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Build the production container
        run: docker build --pull --tag southern-passage:ci .
