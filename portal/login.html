<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061c27">
  <title>Sign in · Southern Passage</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="mark" aria-hidden="true"><span></span></div>
      <p class="eyebrow">Southern Passage</p>
      <h1 id="login-title">Voyage intelligence</h1>
      <p class="intro">Sign in to access the protected operational workspace.</p>
      {{ERROR}}
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Enter workspace</button>
      </form>
      <p class="support">Authorized access only</p>
    </section>
  </main>
</body>
</html>
